<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - DIGITRACE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>tailwind.config={theme:{extend:{colors:{ocean:'#006994',eco:'#22963E',ecoLight:'#E8F5E9',warning:'#F59E0B',bg:'#F5F7F5'},fontFamily:{sans:['Poppins','sans-serif']}}}}</script>
    <style>body{font-family:'Poppins',sans-serif;background:#F5F7F5}::-webkit-scrollbar{display:none}</style>
</head>
<body class="min-h-screen max-w-md mx-auto bg-bg text-gray-800 pb-10">
    <header class="px-5 pt-6 pb-4 flex items-center justify-between"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-2xl bg-ecoLight flex items-center justify-center"><i class="fa-solid fa-shield-halved text-eco"></i></div><div><h1 class="text-base font-bold text-gray-900">Admin DIGITRACE</h1><p class="text-[10px] font-medium text-gray-400">DATA SELURUH PENGGUNA</p></div></div><button data-logout type="button" class="w-10 h-10 rounded-2xl border border-gray-100 bg-white text-gray-400 shadow-sm" aria-label="Keluar"><i class="fa-solid fa-right-from-bracket"></i></button></header>
    <main class="px-5 space-y-5">
        <p id="adminFeedback" class="hidden rounded-2xl border px-4 py-3 text-xs font-medium" role="alert"></p>
        <section class="rounded-[1.75rem] bg-eco p-5 text-white shadow-lg shadow-eco/15"><p class="text-[10px] font-semibold uppercase tracking-widest text-white/70">Ringkasan kontribusi</p><div class="mt-4 grid grid-cols-3 gap-2"><div><p id="userCount" class="text-2xl font-extrabold">0</p><p class="text-[9px] text-white/75">Pengguna aktif</p></div><div><p id="globalScanCount" class="text-2xl font-extrabold">0</p><p class="text-[9px] text-white/75">Total scan</p></div><div><p id="globalPoints" class="text-2xl font-extrabold">0</p><p class="text-[9px] text-white/75">Total poin</p></div></div></section>

        <section class="rounded-3xl border border-gray-100 bg-white p-5 shadow-sm"><div class="flex items-center justify-between"><div><h2 class="text-sm font-bold text-gray-900">Distribusi Sampah</h2><p class="text-[10px] text-gray-400">Seluruh hasil pemilahan</p></div><i class="fa-solid fa-chart-pie text-xl text-eco"></i></div><div id="adminChartEmpty" class="hidden py-7 text-center text-xs text-gray-400">Belum ada scan dari pengguna.</div><div id="adminChartContent" class="mt-4 flex items-center gap-4"><svg id="adminPieChart" viewBox="0 0 100 100" class="h-32 w-32 shrink-0" role="img" aria-label="Pie chart seluruh sampah"></svg><div id="adminChartLegend" class="min-w-0 flex-1 space-y-2"></div></div></section>

        <section><div class="flex items-center justify-between"><div><h2 class="text-sm font-bold text-gray-900">Riwayat Semua Pengguna</h2><p class="text-[10px] text-gray-400">Filter untuk melihat data tertentu</p></div></div><div class="mt-3 grid grid-cols-2 gap-2"><select id="adminUserFilter" class="rounded-xl border border-gray-200 bg-white px-3 py-2.5 text-[11px] font-medium text-gray-600 outline-none"><option value="">Semua pengguna</option></select><select id="adminTypeFilter" class="rounded-xl border border-gray-200 bg-white px-3 py-2.5 text-[11px] font-medium text-gray-600 outline-none"><option value="">Semua jenis</option></select></div><div id="adminHistory" class="mt-3 space-y-3"></div></section>
    </main>
    <script type="module" src="js/admin-page.js"></script>
</body>
</html>
