<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking - DIGITRACE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>tailwind.config={theme:{extend:{colors:{eco:'#22963E',ecoLight:'#E8F5E9',warning:'#F59E0B',bg:'#F5F7F5'},fontFamily:{sans:['Poppins','sans-serif']}}}}</script>
    <style>body{font-family:'Poppins',sans-serif;background:#F5F7F5}::-webkit-scrollbar{display:none}.filter-pill{transition:all .2s;border:1.5px solid transparent}.filter-pill.active{background:#22963E;color:#fff;border-color:#22963E;font-weight:700}.filter-pill:not(.active){background:#fff;color:#6b7280;border-color:#e5e7eb}.nav-item{position:relative}.nav-item.active{color:#22963E}.nav-item.active::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:36px;height:3px;background:#22963E;border-radius:0 0 4px 4px}</style>
</head>
<body class="antialiased text-gray-800 min-h-screen flex flex-col max-w-md mx-auto relative pb-20 bg-bg">
    <header class="px-5 pt-6 pb-3 flex items-center justify-between"><div class="flex items-center gap-3"><div class="w-10 h-10 bg-ecoLight rounded-2xl flex items-center justify-center"><i class="fa-solid fa-recycle text-lg text-eco"></i></div><div><h1 class="text-base font-bold text-gray-900 leading-tight">DIGITRACE</h1><p class="text-[9px] text-gray-400 font-medium tracking-wide">LEADERBOARD KONTRIBUSI</p></div></div><div id="profileInitial" class="w-10 h-10 rounded-2xl bg-ecoLight border-2 border-eco/30 flex items-center justify-center font-bold text-eco">?</div></header>
    <main class="flex-1 px-5 flex flex-col gap-4 mt-1"><p id="leaderboardFeedback" class="hidden rounded-2xl border px-4 py-3 text-xs font-medium" role="alert"></p><div id="areaFilters" class="flex gap-2 overflow-x-auto pb-1"><button class="filter-pill active shrink-0 px-3.5 py-1.5 rounded-xl text-[11px]" data-area="">Semua Daerah</button></div><section class="bg-eco rounded-[1.75rem] p-5 text-white shadow-lg shadow-eco/20 relative overflow-hidden"><div class="absolute -right-6 -top-6 w-28 h-28 rounded-full bg-white/10"></div><p class="relative z-10 text-[10px] text-white/70 font-semibold uppercase tracking-widest">Top Kontributor</p><div id="podium" class="relative z-10 mt-5 grid grid-cols-3 gap-3 items-end"></div></section><div class="flex justify-between items-center px-1"><h2 class="font-semibold text-sm text-gray-900">Semua Peringkat</h2><span id="totalLabel" class="text-[11px] text-gray-400 font-medium"></span></div><div id="rankList" class="flex flex-col gap-2.5 pb-2"></div></main>
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 max-w-md mx-auto z-50"><div class="flex items-center justify-around px-3 pt-1.5 pb-4"><a href="index.html" class="nav-item flex flex-col items-center gap-0.5 flex-1 py-1.5 rounded-2xl text-gray-400"><i class="fa-solid fa-house text-[18px]"></i><span class="text-[9px] font-medium">Beranda</span></a><a href="scan.html" class="nav-item flex flex-col items-center gap-0.5 flex-1 py-1.5 rounded-2xl text-gray-400"><i class="fa-solid fa-camera text-[18px]"></i><span class="text-[9px] font-medium">Scan</span></a><a href="dashboard.html" class="nav-item flex flex-col items-center gap-0.5 flex-1 py-1.5 rounded-2xl text-gray-400"><i class="fa-solid fa-clipboard-list text-[18px]"></i><span class="text-[9px] font-medium">Laporan</span></a><a href="leaderboard.html" class="nav-item active flex flex-col items-center gap-0.5 flex-1 py-1.5 rounded-2xl"><i class="fa-solid fa-trophy text-[18px]"></i><span class="text-[9px] font-semibold">Ranking</span></a></div></nav>
    <script type="module" src="js/leaderboard-page.js"></script>
</body>
</html>
