<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edukasi Pemilahan - DIGITRACE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>tailwind.config={theme:{extend:{colors:{eco:'#22963E',ecoLight:'#E8F5E9',bg:'#F5F7F5',warning:'#F59E0B'},fontFamily:{sans:['Poppins','sans-serif']}}}}</script>
    <style>body{font-family:'Poppins',sans-serif;background:#F5F7F5}::-webkit-scrollbar{display:none}</style>
</head>
<body class="min-h-screen max-w-md mx-auto bg-bg text-gray-800 pb-32">
    <header class="px-5 pt-6 pb-4 flex items-center gap-3">
        <a href="identify.html" class="w-10 h-10 rounded-2xl bg-white border border-gray-100 flex items-center justify-center text-gray-700 shadow-sm" aria-label="Kembali"><i class="fa-solid fa-arrow-left"></i></a>
        <div><h1 class="text-base font-bold text-gray-900">Panduan Pemilahan</h1><p class="text-[10px] text-gray-400 font-medium">Kenali, pilah, dan kelola</p></div>
    </header>
    <main class="px-5">
        <p id="educationFeedback" class="hidden mb-4 rounded-2xl border px-4 py-3 text-xs font-medium" role="alert"></p>
        <section id="typeHero" class="rounded-[1.75rem] bg-eco p-5 text-white shadow-lg shadow-eco/15">
            <div class="flex gap-4 items-center"><div id="resinNumber" class="w-16 h-16 rounded-3xl bg-white/15 flex items-center justify-center text-3xl font-extrabold">?</div><div><p id="typeCode" class="text-xs font-semibold text-white/75">MEMUAT</p><h2 id="typeName" class="mt-1 text-xl font-bold leading-tight">Informasi jenis plastik</h2></div></div>
            <p id="shortDescription" class="mt-4 text-[11px] leading-relaxed text-white/85"></p>
        </section>

        <section class="mt-5 rounded-3xl border border-gray-100 bg-white p-5 shadow-sm">
            <h3 class="flex items-center gap-2 text-sm font-bold text-gray-900"><i class="fa-solid fa-fingerprint text-eco"></i> Ciri-ciri</h3>
            <p id="characteristics" class="mt-2 text-xs leading-relaxed text-gray-600"></p>
            <div class="mt-4 border-t border-gray-100 pt-4"><h3 class="flex items-center gap-2 text-sm font-bold text-gray-900"><i class="fa-solid fa-earth-asia text-eco"></i> Dampak lingkungan</h3><p id="environmentalImpact" class="mt-2 text-xs leading-relaxed text-gray-600"></p></div>
        </section>

        <section class="mt-5 rounded-3xl border border-gray-100 bg-white p-5 shadow-sm">
            <div class="flex items-center justify-between gap-3"><h3 class="flex items-center gap-2 text-sm font-bold text-gray-900"><i class="fa-solid fa-recycle text-eco"></i> Cara memilah</h3><span id="recycleBadge" class="rounded-full px-2.5 py-1 text-[9px] font-bold"></span></div>
            <ol id="sortingSteps" class="mt-4 space-y-3"></ol>
        </section>

        <section class="mt-5 rounded-3xl border border-gray-100 bg-white p-5 shadow-sm"><h3 class="text-sm font-bold text-gray-900">Contoh sampah</h3><div id="examples" class="mt-3 flex flex-wrap gap-2"></div></section>
    </main>
    <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/95 backdrop-blur border-t border-gray-100 px-5 pt-3 pb-5 z-20">
        <button id="saveScanBtn" type="button" class="flex w-full items-center justify-center gap-2 rounded-2xl bg-eco px-5 py-3.5 text-sm font-semibold text-white shadow-sm transition hover:brightness-110 disabled:cursor-wait"><i class="fa-solid fa-coins text-warning"></i><span>Simpan & dapatkan 10 poin</span></button>
    </div>
    <script type="module" src="js/education-page.js"></script>
</body>
</html>
