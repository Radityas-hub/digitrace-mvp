<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - DIGITRACE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>tailwind.config={theme:{extend:{colors:{ocean:'#006994',eco:'#22963E',ecoLight:'#E8F5E9',warning:'#F59E0B',bg:'#F5F7F5'},fontFamily:{sans:['Poppins','sans-serif']}}}}</script>
    <style>body{font-family:'Poppins',sans-serif;background:#F5F7F5}::-webkit-scrollbar{display:none}.nav-item{position:relative}.nav-item.active{color:#22963E}.nav-item.active::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:36px;height:3px;background:#22963E;border-radius:0 0 4px 4px}</style>
</head>
<body class="antialiased text-gray-800 min-h-screen flex flex-col max-w-md mx-auto relative pb-24 bg-bg">
    <header class="px-5 pt-6 pb-3 flex items-center justify-between">
        <div class="flex items-center gap-3"><div class="w-10 h-10 bg-ecoLight rounded-2xl flex items-center justify-center"><i class="fa-solid fa-recycle text-lg text-eco"></i></div><div><h1 class="text-base font-bold text-gray-900 leading-tight">DIGITRACE</h1><p class="text-[9px] text-gray-400 font-medium tracking-wide">LAPORAN & EDUKASI</p></div></div>
        <button data-logout type="button" class="w-10 h-10 rounded-2xl bg-white border border-gray-100 shadow-sm text-gray-400" aria-label="Keluar"><i class="fa-solid fa-right-from-bracket"></i></button>
    </header>

    <div class="px-5 mt-2 mb-1"><p class="text-xs text-gray-400 font-medium">Selamat datang 👋</p><h2 id="profileName" class="text-xl font-bold text-gray-900 leading-tight">Memuat...</h2></div>

    <main class="flex-1 px-5 flex flex-col gap-5 mt-3">
        <p id="dashboardFeedback" class="hidden rounded-2xl border px-4 py-3 text-xs font-medium" role="alert"></p>
        <section class="bg-eco rounded-[1.75rem] p-5 text-white shadow-lg shadow-eco/20 relative overflow-hidden"><div class="absolute -right-6 -top-6 w-28 h-28 rounded-full bg-white/10"></div><div class="absolute -right-2 top-10 w-16 h-16 rounded-full bg-white/5"></div><div class="relative z-10 flex items-center justify-between"><div><p class="text-[11px] text-white/80 font-medium mb-1">Total Poin</p><h2 id="pointsDisplay" class="text-4xl font-extrabold tracking-tight leading-none">0</h2></div><div class="flex flex-col items-center gap-1.5"><div class="w-12 h-12 bg-white/20 rounded-2xl flex items-center justify-center"><i class="fa-solid fa-medal text-warning text-2xl"></i></div><span id="contributorTier" class="text-[9px] font-semibold text-white/90">Kontributor Pemula</span></div></div></section>

        <section class="grid grid-cols-2 gap-3"><div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm"><div class="flex items-center gap-2 mb-2"><div class="w-8 h-8 rounded-xl bg-ecoLight flex items-center justify-center"><i class="fa-solid fa-camera text-eco text-sm"></i></div><span class="text-[10px] text-gray-400 font-medium">Total Scan</span></div><div class="flex items-end gap-1"><span id="scanCount" class="text-2xl font-bold text-gray-900">0</span><span class="text-xs text-gray-400 mb-1 font-medium">kali</span></div></div><div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm"><div class="flex items-center gap-2 mb-2"><div class="w-8 h-8 rounded-xl bg-blue-50 flex items-center justify-center"><i class="fa-solid fa-recycle text-ocean text-sm"></i></div><span class="text-[10px] text-gray-400 font-medium">Jenis Plastik</span></div><div class="flex items-end gap-1"><span id="typeCount" class="text-2xl font-bold text-gray-900">0</span><span class="text-xs text-gray-400 mb-1 font-medium">jenis</span></div></div></section>

        <section class="bg-white rounded-3xl border border-gray-100 p-5 shadow-sm"><div class="flex items-center justify-between"><div><h3 class="text-sm font-bold text-gray-900">Komposisi Sampahmu</h3><p class="mt-0.5 text-[10px] text-gray-400">Berdasarkan riwayat yang disimpan</p></div><i class="fa-solid fa-chart-pie text-xl text-eco"></i></div><div id="chartEmpty" class="hidden py-7 text-center text-xs text-gray-400">Belum ada data untuk divisualkan.</div><div id="chartContent" class="mt-4 flex items-center gap-4"><svg id="pieChart" viewBox="0 0 100 100" class="h-32 w-32 shrink-0" role="img" aria-label="Pie chart jenis plastik"></svg><div id="chartLegend" class="min-w-0 flex-1 space-y-2"></div></div></section>

        <section><div class="flex justify-between items-center mb-3 px-1"><h3 class="font-semibold text-sm text-gray-900">Riwayat Terbaru</h3><a href="history.html" class="text-[11px] text-eco font-semibold">Lihat Semua</a></div><div id="historyList" class="space-y-3"></div></section>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 max-w-md mx-auto z-50"><div class="flex items-center justify-around px-3 pt-1.5 pb-4"><a href="index.html" class="nav-item flex flex-col items-center gap-0.5 flex-1 py-1.5 rounded-2xl transition-all text-gray-400"><i class="fa-solid fa-house text-[18px]"></i><span class="text-[9px] font-medium">Beranda</span></a><a href="scan.html" class="nav-item flex flex-col items-center gap-0.5 flex-1 py-1.5 rounded-2xl transition-all text-gray-400"><i class="fa-solid fa-camera text-[18px]"></i><span class="text-[9px] font-medium">Scan</span></a><a href="dashboard.html" class="nav-item active flex flex-col items-center gap-0.5 flex-1 py-1.5 rounded-2xl transition-all"><i class="fa-solid fa-clipboard-list text-[18px]"></i><span class="text-[9px] font-semibold">Laporan</span></a><a href="leaderboard.html" class="nav-item flex flex-col items-center gap-0.5 flex-1 py-1.5 rounded-2xl transition-all text-gray-400"><i class="fa-solid fa-trophy text-[18px]"></i><span class="text-[9px] font-medium">Ranking</span></a></div></nav>
    <script type="module" src="js/dashboard-page.js"></script>
</body>
</html>
